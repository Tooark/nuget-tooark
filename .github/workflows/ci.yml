name: CI

# Valida pull requests antes do merge: formatação (.editorconfig), lista de pacotes do release e grupos do site
# de documentação, build em Release (warnings são erros), validação de pacote contra a baseline e a suíte
# completa de testes, com cobertura.
# A publicação continua exclusiva do workflow de release (tooark.yml), disparado no push em main. O job
# "build-and-test" é status check obrigatório no ruleset da branch main: um pull request vermelho não pode ser
# mesclado.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Check formatting (.editorconfig)
        run: dotnet format --verify-no-changes --no-restore

      - name: Check every packable project is in the release list
        run: bash scripts/check-release-packages.sh

      - name: Check every packable project is in the documentation site
        run: python3 docs/build.py --check

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # O pack roda a validação de pacote contra a baseline (PackageValidationBaselineVersion): uma quebra de API
      # que não esteja no CompatibilitySuppressions.xml do pacote falha o pull request, e não só a publicação.
      # Os pacotes gerados aqui são descartados; quem publica é o tooark.yml.
      - name: Pack (package validation)
        run: dotnet pack --configuration Release --no-build --output artifacts/packages

      - name: Test (with coverage)
        run: >-
          dotnet test --project Tooark.Tests/Tooark.Tests.csproj --configuration Release --no-build
          --
          --report-xunit-trx
          --coverlet --coverlet-output-format cobertura
          --results-directory "${{ github.workspace }}/TestResults"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore

      - name: Coverage summary
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          # O glob cobre o coverage.cobertura.xml e um eventual coverage.cobertura.<timestamp>.xml (o coverlet.MTP
          # não sobrescreve o existente). O ReportGenerator funde o que encontrar num relatório só.
          reportgenerator \
            -reports:"TestResults/coverage.cobertura*.xml" \
            -targetdir:coverage-report \
            -reporttypes:"MarkdownSummaryGithub;Cobertura"
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage-report/
            TestResults/coverage.cobertura*.xml
          if-no-files-found: ignore
