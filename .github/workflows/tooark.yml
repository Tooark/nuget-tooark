name: Build and deploy package

# Publica no NuGet a cada push em main cuja versão (Directory.Build.props) ainda não tem tag. A validação de
# pull request fica no ci.yml; aqui build, testes e scanner de segurança rodam de novo como última barreira.
#
# Ordem deliberada: os pacotes são publicados ANTES de a tag e a release existirem. Se uma publicação falhar
# no meio, nada foi marcado como lançado e o próximo push em main tenta de novo; "--skip-duplicate" ignora os
# pacotes que já subiram. Só depois de tudo publicado a tag v<versão> e a GitHub Release são criadas.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  SECURITY_SCANNER_IMAGE: ghcr.io/tooark/security-scanner:1.9
  NUGET_SOURCE: https://api.nuget.org/v3/index.json
  # Projetos empacotados, em ordem de dependência (o mesmo conjunto do agregador Tooark).
  PACKAGES: >-
    Tooark.Notifications
    Tooark.Validations
    Tooark.Enums
    Tooark.Attributes
    Tooark.Exceptions
    Tooark.Utils
    Tooark.Extensions
    Tooark.AspNetCore
    Tooark.Dtos
    Tooark.Entities
    Tooark.ValueObjects
    Tooark.Securities
    Tooark.Securities.OpenId
    Tooark.Observability
    Tooark.Mediator.Abstractions
    Tooark.Mediator
    Tooark.Mediator.EntityFrameworkCore
    Tooark

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
      has_tag: ${{ steps.check_tag.outputs.has_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract version from Directory.Build.props
        id: extract_version
        run: |
          VERSION=$(grep -oPm1 "(?<=<Version>)[^<]+" Directory.Build.props)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if the version tag exists
        id: check_tag
        run: |
          VERSION="${{ steps.extract_version.outputs.version }}"
          if [ -n "$(git ls-remote --tags origin "refs/tags/v${VERSION}")" ]; then
            echo "has_tag=true" >> "$GITHUB_OUTPUT"
            echo "::warning::A versão v${VERSION} já existe (tag publicada). Workflow interrompido sem build e sem publicação. Atualize a versão no Directory.Build.props para lançar uma nova versão."
          else
            echo "has_tag=false" >> "$GITHUB_OUTPUT"
            echo "Tag v${VERSION} não existe. Prosseguindo com o build e a publicação."
          fi

  build-and-deploy:
    needs: check-version
    if: needs.check-version.outputs.has_tag == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write # cria a tag e a GitHub Release
      packages: read # puxa a imagem do security-scanner do GHCR
    env:
      VERSION: ${{ needs.check-version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --project Tooark.Tests/Tooark.Tests.csproj --configuration Release --no-build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Trivy vulnerability DB
        uses: actions/cache@v6
        with:
          path: ~/.cache/trivy
          key: security-scanner-trivy-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            security-scanner-trivy-${{ runner.os }}-

      - name: Security scan (gate)
        env:
          TRIVY_SEVERITY_FAIL: "HIGH,CRITICAL"
          TRIVY_EXIT_CODE: 1
        run: |
          mkdir -p "${{ github.workspace }}/scan-reports"
          chmod -R 777 "${{ github.workspace }}/scan-reports"
          mkdir -p "$HOME/.cache/trivy"
          chmod -R 777 "$HOME/.cache/trivy"
          docker run --rm \
            -v "${{ github.workspace }}:/workspace:ro" \
            -v "$HOME/.cache/trivy:/home/app/.cache/trivy" \
            -v "${{ github.workspace }}/scan-reports:/reports" \
            -e GITHUB_ACTIONS -e GITHUB_REF_NAME -e GITHUB_SHA \
            -e GITHUB_REPOSITORY -e GITHUB_ACTOR -e GITHUB_RUN_ID \
            -e GITHUB_JOB -e GITHUB_SERVER_URL \
            -e TRIVY_SEVERITY -e TRIVY_SEVERITY_FAIL \
            "${{ env.SECURITY_SCANNER_IMAGE }}" \
            filesystem-scan /workspace

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: scan-reports/

      - name: Pack
        run: |
          for project in $PACKAGES; do
            dotnet pack "$project/$project.csproj" --configuration Release --no-build --output artifacts/packages
          done
          ls -1 artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/packages/

      - name: Publish to NuGet
        run: |
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source "$NUGET_SOURCE" \
            --skip-duplicate

      - name: Create the tag and the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES_FILE="Notes/v${VERSION}.md"
          if [ -f "$NOTES_FILE" ]; then
            gh release create "v${VERSION}" --target "$GITHUB_SHA" --title "Release v${VERSION}" --notes-file "$NOTES_FILE" --latest
          else
            echo "::warning::Arquivo de notas ${NOTES_FILE} não encontrado; a release recebe um corpo genérico."
            gh release create "v${VERSION}" --target "$GITHUB_SHA" --title "Release v${VERSION}" --notes "Automated release for version v${VERSION}" --latest
          fi
