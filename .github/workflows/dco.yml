name: DCO

# Todo commit de um pull request precisa do rodapé "Signed-off-by:" (Developer Certificate of Origin,
# `git commit -s`). O check é do próprio repositório, sem app externo: falha listando os commits sem assinatura
# e mostra como corrigir (`git rebase --signoff`). Mesmo workflow do Tooark/web-components.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check Signed-off-by on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          # Commits de merge ficam de fora: não carregam mudança própria.
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::Commit $(git log -1 --format='%h %s' "$sha") has no Signed-off-by trailer"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo ""
            echo "$missing commit(s) without DCO sign-off. Sign your commits with 'git commit -s' and fix the"
            echo "existing ones with: git rebase --signoff $BASE && git push --force-with-lease"
            echo "See https://developercertificate.org/ and CONTRIBUTING.md."
            exit 1
          fi
          echo "All commits are signed off."
