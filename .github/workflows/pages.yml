name: Pages

# Publica o site de documentação em https://tooark.com/nuget-tooark/. As páginas dos pacotes vêm dos READMEs
# (docs/build.py) e a referência de API, das docs XML; nada é escrito duas vezes. Este workflow não toca a
# publicação no NuGet: uma falha na documentação nunca segura uma release.
#
# O deploy por artefato precisa que o Pages use a fonte "GitHub Actions" (Settings > Pages), uma única vez. A
# API não configura isso, e a primeira execução falha com "Pages site not found" até alguém fazer.
#
# Build e deploy ficam em jobs separados, como o GitHub recomenda. Num job só, o deploy consultava o artefato
# logo depois do upload e às vezes ainda não o encontrava ("No artifacts named github-pages were found"); e
# reexecutar o job subia um segundo artefato com o mesmo nome, o que o deploy também recusa. Separados, o
# deploy só começa com o artefato já publicado, e "Re-run failed jobs" repete só o deploy.
on:
  push:
    branches:
      - main
    paths:
      - "**/README.md"
      - "**/README.pt-BR.md"
      - "**/*.cs"
      - "docs/**"
      - "Media/tooark.svg"
      - "Directory.Build.props"
      - ".config/dotnet-tools.json"
      - ".github/workflows/pages.yml"
  # Os cartões mostram os downloads de cada pacote, lidos do nuget.org no build. Sem esta execução diária o
  # número só mudaria no próximo push que tocasse a documentação.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# O padrão é somente leitura. Só o job deploy recebe pages: write e id-token: write, que é o que permite ao
# deploy-pages provar que o deploy veio deste workflow; o build, que executa restore e ferramentas de
# terceiros, não emite token.
permissions:
  contents: read

# Um deploy por vez, e nunca cancelar um em andamento: um deploy cancelado pode deixar o site pela metade.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the documentation site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # o configure-pages consulta a configuração do site

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: |
          dotnet restore
          dotnet tool restore

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # Gera docs/_site: inglês na raiz, português em pt-BR/ e a API nos dois. Falha em qualquer aviso do DocFX
      # (link quebrado, âncora inexistente) e quando um pacote empacotável não está nos grupos do site.
      - name: Build the site
        run: python3 docs/build.py

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  deploy:
    name: Publish the documentation site
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
