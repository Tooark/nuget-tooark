# ==============================================================================
# Tooark — Dependabot configuration
# ==============================================================================
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Scope:
#   - NuGet: weekly, against the central pins in Directory.Packages.props.
#     Minor/patch updates are grouped into one PR; the test tooling (xunit,
#     coverlet, Microsoft.Testing.*) is grouped separately and may include
#     majors, because those packages only move together.
#   - Runtime-bound packages (Microsoft.AspNetCore.Authentication.*,
#     Microsoft.AspNetCore.DataProtection*, Microsoft.Extensions.*, EF Core,
#     System.Security.Cryptography.Xml) follow the line of the single target
#     framework (net10.0 -> 10.0.x). Dependabot bumps their minor/patch
#     releases; a major bump is ignored, because it only happens together
#     with a new target framework, in a Tooark major. Up to 4.x these pins
#     were duplicated per target framework and bumped by hand.
#   - GitHub Actions: weekly, minor/patch grouped into one PR.
#   - The security-scanner image used by the release workflow is pinned by
#     hand in the workflow env; Dependabot does not track it.
# ==============================================================================

version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "nuget"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      # xunit.v3 and xunit.runner.visualstudio are released together and a
      # major of one needs the major of the other; coverlet.MTP follows the
      # Microsoft.Testing.Platform line shipped by xunit.
      test-tooling:
        patterns:
          - "xunit*"
          - "coverlet*"
          - "Microsoft.Testing.*"
          - "Microsoft.NET.Test.Sdk"
        update-types:
          - "major"
          - "minor"
          - "patch"
      nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Runtime-bound lines stay on the line of the target framework: no major bumps.
      - dependency-name: "Microsoft.AspNetCore.Authentication.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.AspNetCore.DataProtection*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Security.Cryptography.Xml"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
