# ==============================================================================
# Tooark — Dependabot configuration
# ==============================================================================
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Scope:
#   - NuGet: weekly, against the central pins in Directory.Packages.props.
#     Minor/patch updates are grouped into one PR; the test tooling (xunit,
#     coverlet, Microsoft.Testing.*) is grouped separately and may include
#     majors, because those packages only move together.
#   - Runtime-bound packages (Microsoft.AspNetCore.Authentication.*,
#     Microsoft.AspNetCore.DataProtection*, Microsoft.Extensions.*, EF Core,
#     System.Security.Cryptography.Xml) are
#     NOT handled by Dependabot. They have one pin per target framework in
#     conditional ItemGroups, and Dependabot only evaluates the first one: it
#     bumped the 8.0.x line and left the 10.0.x line behind (PR #54). Those
#     pins are bumped by hand, in pairs, after each .NET servicing release;
#     scripts/check-package-pairs.sh (run by CI) checks the structure.
#   - GitHub Actions: weekly, minor/patch grouped into one PR.
#   - The security-scanner image used by the release workflow is pinned by
#     hand in the workflow env; Dependabot does not track it.
# ==============================================================================

version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "nuget"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      # xunit.v3 and xunit.runner.visualstudio are released together and a
      # major of one needs the major of the other; coverlet.MTP follows the
      # Microsoft.Testing.Platform line shipped by xunit.
      test-tooling:
        patterns:
          - "xunit*"
          - "coverlet*"
          - "Microsoft.Testing.*"
          - "Microsoft.NET.Test.Sdk"
        update-types:
          - "major"
          - "minor"
          - "patch"
      nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Runtime-bound lines, pinned per target framework: bumped by hand, in pairs.
      - dependency-name: "Microsoft.AspNetCore.Authentication.*"
      - dependency-name: "Microsoft.AspNetCore.DataProtection*"
      - dependency-name: "Microsoft.Extensions.*"
      - dependency-name: "Microsoft.EntityFrameworkCore*"
      - dependency-name: "System.Security.Cryptography.Xml"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
